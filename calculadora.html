<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proyección Hípica</title>
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --border: #334155; --gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); padding: 20px; font-size: 14px;
            width: 100vw; overflow-x: hidden; display: flex; justify-content: center;
        }

        .container { width: 100%; max-width: 1000px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .panel-config {
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px;
            margin-bottom: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .config-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
        .config-group label { font-size: 13px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        
        input { 
            background-color: #0f172a; border: 1px solid var(--border); color: var(--text-main); 
            padding: 12px; border-radius: 6px; font-size: 16px; outline: none; width: 100%;
        }
        input:focus { border-color: var(--accent); }

        .btn-add { 
            background: var(--accent); color: white; border: none; padding: 12px 20px; 
            border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-add:hover { background: var(--accent-hover); }

        .table-wrapper { 
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; 
            overflow-x: auto; width: 100%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        
        th { 
            background-color: #1e293b; color: var(--text-muted); font-weight: 600; 
            text-transform: uppercase; font-size: 12px; padding: 15px 10px; 
            text-align: center; border-bottom: 2px solid var(--border);
        }
        
        td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
        tr:hover td { background-color: rgba(59, 130, 246, 0.05); }

        .resultado { font-size: 20px; font-weight: bold; color: var(--success); }
        
        .btn-delete { 
            background: transparent; color: var(--danger); border: none; 
            font-size: 20px; cursor: pointer; transition: 0.2s; 
        }
        .btn-delete:hover { color: #ff6b6b; transform: scale(1.1); }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }

        .formula-text { font-size: 12px; color: var(--text-muted); margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🧮 Calculadora de Proyección</h1>
            <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: bold;">⬅ Volver al Sistema</a>
        </header>

        <!-- CONFIGURACIÓN GLOBAL DE LA CARRERA -->
        <div class="panel-config">
            <div class="config-group">
                <label>Distancia de la Carrera de HOY (Metros)</label>
                <input type="number" id="distancia_hoy" placeholder="Ej: 1400" onchange="recalcularTodo()">
            </div>
            <div class="config-group">
                <label>Nro de Carrera (Opcional)</label>
                <input type="text" id="nro_carrera" placeholder="Ej: 1">
            </div>
        </div>

        <!-- TABLA DE CABALLOS -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nro</th>
                        <th>Ejemplar</th>
                        <th>Último Tiempo (seg)</th>
                        <th>Distancia de esa Carrera (mts)</th>
                        <th style="color: var(--gold);">Tiempo Proyectado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Las filas se generan aquí -->
                </tbody>
            </table>
            <div class="empty-state" id="emptyState">
                Agrega un caballo para comenzar a proyectar.
            </div>
        </div>
        
        <div style="margin-top: 20px; text-align: right;">
            <button onclick="agregarFila()" class="btn-add" style="display: inline-flex;">➕ Añadir Caballo</button>
        </div>
    </div>

    <script>
        // Array para guardar los datos de los caballos
        let filasCaballos = [];

        function agregarFila() {
            // Creamos un objeto vacío para el nuevo caballo
            const nuevoCaballo = {
                id: Date.now(),
                nro: '',
                nombre: '',
                tiempo: '',
                distancia_anterior: ''
            };
            filasCaballos.push(nuevoCaballo);
            renderTabla();
        }

        function eliminarFila(id) {
            filasCaballos = filasCaballos.filter(c => c.id !== id);
            renderTabla();
        }

        function actualizarDato(id, campo, valor) {
            const caballo = filasCaballos.find(c => c.id === id);
            if (caballo) {
                caballo[campo] = valor;
                recalcularTodo(); // Recalcula al instante
            }
        }

        function recalcularTodo() {
            const distHoy = parseFloat(document.getElementById('distancia_hoy').value);
            
            filasCaballos.forEach(c => {
                const t = parseFloat(c.tiempo);
                const d_ant = parseFloat(c.distancia_anterior);
                
                let proyeccion = "---";
                let formula = "";

                if (!isNaN(distHoy) && !isNaN(t) && !isNaN(d_ant) && d_ant > 0) {
                    // Fórmula: (Tiempo * Distancia Hoy) / Distancia Anterior
                    const calc = (t * distHoy) / d_ant;
                    proyeccion = calc.toFixed(2) + " seg";
                    formula = `(${t} × ${distHoy}) / ${d_ant}`;
                }

                // Actualizamos la celda correspondiente en el DOM
                const celdaResultado = document.getElementById(`res_${c.id}`);
                if (celdaResultado) {
                    celdaResultado.innerHTML = `<span class="resultado">${proyeccion}</span><span class="formula-text">${formula}</span>`;
                }
            });
        }

        function renderTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = '';

            if (filasCaballos.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            filasCaballos.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="number" value="${c.nro}" onchange="actualizarDato(${c.id}, 'nro', this.value)" placeholder="Ej: 1" style="text-align:center;"></td>
                    <td><input type="text" value="${c.nombre}" onchange="actualizarDato(${c.id}, 'nombre', this.value)" placeholder="Nombre" style="text-align:left;"></td>
                    <td><input type="number" step="0.01" value="${c.tiempo}" onchange="actualizarDato(${c.id}, 'tiempo', this.value)" placeholder="Ej: 72.5" style="text-align:center;"></td>
                    <td><input type="number" value="${c.distancia_anterior}" onchange="actualizarDato(${c.id}, 'distancia_anterior', this.value)" placeholder="Ej: 1200" style="text-align:center;"></td>
                    <td id="res_${c.id}"></td>
                    <td><button class="btn-delete" onclick="eliminarFila(${c.id})">🗑️</button></td>
                `;
                tbody.appendChild(tr);
            });
            
            recalcularTodo(); // Aseguramos que los resultados estén actualizados
        }

        // Inicializar con un caballo de ejemplo
        window.onload = () => {
            agregarFila();
        };
    </script>
</body>
</html>
