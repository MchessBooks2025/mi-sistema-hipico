<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Pro USA</title>
<style>
:root{
  --bg:#f1f5f9; --panel:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --accent:#2563eb; --accent-hover:#1d4ed8;
  --success:#10b981; --danger:#ef4444;
  --gold:#FFD700; --silver:#C0C0C0; --bronze:#CD7F32;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); padding:16px; font-size:14px; min-height:100vh;
}
header{margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border)}
h1{font-size:22px;font-weight:800;background:linear-gradient(90deg,#2563eb,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel h2{font-size:14px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-header h2{margin-bottom:0}
.race-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.race-tab{padding:8px 14px;border:2px solid var(--border);background:var(--panel);
  color:var(--text-muted);border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s}
.race-tab:hover{border-color:var(--accent);color:var(--accent)}
.race-tab.active{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:transparent;
  color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:var(--text-muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.3px}

/* Estilos compartidos para Inputs y Selects */
.form-group input, .form-group select{
  background:#f8fafc;border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:6px;font-size:14px;outline:none;width:100%;transition:.15s;
  font-family:inherit;
}
.form-group input:focus, .form-group select:focus{border-color:var(--accent);background:#fff}

.horses-list{display:flex;flex-direction:column;gap:10px}
.horse-card{border:1px solid var(--border);border-radius:10px;padding:12px;background:#f8fafc}
.horse-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.horse-badge{font-weight:800;font-size:13px;color:var(--accent)}
.btn-remove{background:transparent;border:1px solid var(--border);color:var(--danger);
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-weight:700;transition:.15s}
.btn-remove:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.horse-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.horse-fields .form-group label{font-size:10px}
.horse-fields .form-group input{padding:7px 9px;font-size:13px}
.btn-add{padding:8px 14px;border:2px dashed var(--accent);background:transparent;
  color:var(--accent);border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s}
.btn-add:hover{background:var(--accent);color:#fff;border-style:solid}
.btn-calcular{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;
  padding:14px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;width:100%;
  margin-top:14px;box-shadow:0 4px 12px rgba(37,99,235,.3);transition:.15s}
.btn-calcular:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.4)}

@keyframes pulse-gold{
  0%,100%{box-shadow:0 0 15px rgba(255,215,0,.5),inset 0 0 10px rgba(255,255,255,.3)}
  50%{box-shadow:0 0 30px rgba(255,215,0,.9),0 0 50px rgba(255,215,0,.4),inset 0 0 20px rgba(255,255,255,.5)}
}
@keyframes pulse-silver{
  0%,100%{box-shadow:0 0 12px rgba(192,192,192,.5),inset 0 0 8px rgba(255,255,255,.3)}
  50%{box-shadow:0 0 25px rgba(192,192,192,.9),0 0 40px rgba(192,192,192,.4),inset 0 0 15px rgba(255,255,255,.5)}
}
@keyframes pulse-bronze{
  0%,100%{box-shadow:0 0 12px rgba(205,127,50,.5),inset 0 0 8px rgba(255,255,255,.2)}
  50%{box-shadow:0 0 25px rgba(205,127,50,.9),0 0 40px rgba(205,127,50,.4),inset 0 0 15px rgba(255,255,255,.4)}
}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.podium-slot{border-radius:12px;padding:14px 10px;text-align:center;position:relative;
  overflow:hidden;color:#1a1a1a;font-weight:800}
.podium-slot.oro{background:linear-gradient(135deg,#FFD700,#FFA500,#FFD700);animation:pulse-gold 2s ease-in-out infinite}
.podium-slot.plata{background:linear-gradient(135deg,#E8E8E8,#A8A8A8,#E8E8E8);animation:pulse-silver 2s ease-in-out infinite}
.podium-slot.bronce{background:linear-gradient(135deg,#E09E5B,#A0522D,#E09E5B);animation:pulse-bronze 2s ease-in-out infinite}
.podium-medal{font-size:28px;line-height:1;margin-bottom:4px}
.podium-pos{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.75}
.podium-num{font-size:24px;font-weight:900;line-height:1.1;margin:4px 0}
.podium-tp{font-size:13px;font-weight:900;opacity:.9}
.result-row{display:grid;grid-template-columns:40px 60px 1fr auto;gap:10px;align-items:center;
  padding:10px;border-radius:8px;margin-bottom:6px;background:#f8fafc;border:1px solid var(--border)}
.result-row.pos-1{border-left:4px solid var(--gold);background:#fffbeb}
.result-row.pos-2{border-left:4px solid var(--silver)}
.result-row.pos-3{border-left:4px solid var(--bronze);background:#fdf6ec}
.result-rank{font-weight:900;font-size:15px;color:var(--text-muted)}
.result-num{font-weight:800;font-size:16px}
.result-info{font-size:11px;color:var(--text-muted)}
.result-tp{font-weight:900;font-size:18px;color:var(--accent)}
.error-msg{color:var(--danger);font-size:13px;font-weight:700;text-align:center;margin-top:10px}

.badge-valor{display:inline-block;background:rgba(16,185,129,.15);color:var(--success);
  border:1px solid var(--success);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;margin-left:6px}
.badge-trampa{display:inline-block;background:rgba(239,68,68,.15);color:var(--danger);
  border:1px solid var(--danger);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;margin-left:6px}

@media(max-width:640px){
  .podium{grid-template-columns:1fr}
  .podium-slot{padding:10px; display:flex; align-items:center; justify-content:space-between;}
  .podium-slot > div {margin:0;}
  .podium-medal{font-size:24px;}
}
</style>
</head>
<body>

<header>
  <h1>🏇 Calculadora Pro USA</h1>
  <div class="subtitle">Ranking por tiempos · Top 3</div>
</header>

<div class="panel">
  <div class="race-tabs" id="raceTabs"></div>
  
  <div class="form-grid">
    <!-- NUEVO SELECT DE HIPÓDROMOS -->
    <div class="form-group">
      <label>Hipódromo</label>
      <select id="hipodromo">
        <optgroup label="🇺🇸 Estados Unidos">
          <option value="santa-anita">Santa Anita</option>
          <option value="del-mar">Del Mar</option>
          <option value="churchill">Churchill Downs</option>
          <option value="belmont">Belmont Park</option>
          <option value="saratoga">Saratoga</option>
          <option value="keeneland">Keeneland</option>
          <option value="gulfstream">Gulfstream Park</option>
          <option value="aqueduct">Aqueduct</option>
          <option value="pimlico">Pimlico</option>
          <option value="oaklawn">Oaklawn Park</option>
          <option value="tampa">Tampa Bay Downs</option>
          <option value="monmouth">Monmouth Park</option>
          <option value="woodbine">Woodbine</option>
        </optgroup>
        <optgroup label="🇻🇪 Venezuela">
          <option value="la-rinconada">La Rinconada</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label>Distancia Hoy (mts)</label>
      <input type="number" id="distanciaHoy" value="1400">
    </div>
    <div class="form-group">
      <label>Clase Hoy (Lote)</label>
      <input type="text" id="loteHoy" placeholder="Ej: clm 12500" value="clm 12500">
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <h2>🐎 Caballos</h2>
    <button class="btn-add" onclick="addHorse()">+ Caballo</button>
  </div>
  <div class="horses-list" id="horsesList"></div>
  <button class="btn-calcular" onclick="calcular()">🏆 Calcular Top 3</button>
  <div id="errorMsg" class="error-msg"></div>
</div>

<div class="panel" id="podiumPanel" style="display:none;">
  <h2>🏆 Top 3 Proyectado</h2>
  <div class="podium" id="podium"></div>
</div>

<div class="panel" id="resultsPanel" style="display:none;">
  <h2>📊 Ranking Completo</h2>
  <div id="resultsList"></div>
</div>

<script>
const NUM_RACES = 15; 
const state = { activeRace: 1, races: {} };

for (let i = 1; i <= NUM_RACES; i++) {
  state.races[i] = { 
    hipodromo: 'santa-anita', 
    distanciaHoy: 1400, 
    loteHoy: 'clm 12500', 
    caballos: [newHorse()] 
  };
}

function newHorse(){ return {num:'',tiempo:'',dist:'',ml:''}; }

function renderTabs(){
  const tabs=document.getElementById('raceTabs'); tabs.innerHTML='';
  for(let i=1;i<=NUM_RACES;i++){
    const b=document.createElement('button');
    b.className='race-tab'+(i===state.activeRace?' active':'');
    b.textContent='Carrera '+i;
    b.onclick=()=>switchRace(i);
    tabs.appendChild(b);
  }
}
function switchRace(n){ saveCurrentRace(); state.activeRace=n; renderTabs(); renderRace(); }

function saveCurrentRace(){
  const r=state.races[state.activeRace];
  r.hipodromo=document.getElementById('hipodromo').value;
  r.distanciaHoy=parseFloat(document.getElementById('distanciaHoy').value)||1400;
  r.loteHoy=document.getElementById('loteHoy').value||'';
  
  const cards=document.querySelectorAll('.horse-card');
  r.caballos=[];
  cards.forEach(c=>{
    r.caballos.push({
      num:c.querySelector('.h-num').value,
      tiempo:c.querySelector('.h-tiempo').value,
      dist:c.querySelector('.h-dist').value,
      ml:c.querySelector('.h-ml').value
    });
  });
}

function renderRace(){
  const r=state.races[state.activeRace];
  document.getElementById('hipodromo').value=r.hipodromo;
  document.getElementById('distanciaHoy').value=r.distanciaHoy;
  document.getElementById('loteHoy').value=r.loteHoy;
  
  const list=document.getElementById('horsesList'); list.innerHTML='';
  r.caballos.forEach(h=>addHorseCard(h));
  
  document.getElementById('podiumPanel').style.display='none';
  document.getElementById('resultsPanel').style.display='none';
  document.getElementById('errorMsg').innerText='';
}

function addHorseCard(h){
  const list=document.getElementById('horsesList');
  const card=document.createElement('div');
  card.className='horse-card';
  card.innerHTML=`
    <div class="horse-card-header">
      <span class="horse-badge">CABALLO ${h.num?'#'+h.num:''}</span>
      <button class="btn-remove" onclick="removeHorse(this)">✕</button>
    </div>
    <div class="horse-fields">
      <div class="form-group"><label>Nº</label><input class="h-num" type="number" placeholder="Ej: 5" value="${h.num||''}"></div>
      <div class="form-group"><label>Tiempo Últ.</label><input class="h-tiempo" placeholder="70.4 / 1:10.4" value="${h.tiempo||''}"></div>
      <div class="form-group"><label>Dist. Últ.</label><input class="h-dist" type="number" placeholder="1400" value="${h.dist||''}"></div>
      <div class="form-group"><label>ML</label><input class="h-ml" placeholder="5/2" value="${h.ml||''}"></div>
    </div>`;
  list.appendChild(card);
  const numInput=card.querySelector('.h-num');
  const badge=card.querySelector('.horse-badge');
  numInput.addEventListener('input',()=>{
    badge.textContent='CABALLO '+(numInput.value?'#'+numInput.value:'');
  });
}
function addHorse(){ addHorseCard(newHorse()); }
function removeHorse(b){ b.closest('.horse-card').remove(); }

function parseTiempo(v){
  if(!v) return NaN;
  v=v.toString().trim();
  if(v.includes(':')){ const p=v.split(':'); return (parseFloat(p[0])*60)+parseFloat(p[1]); }
  return parseFloat(v);
}
function parseOdds(v){
  if(!v) return NaN;
  v=v.toString().trim();
  if(v.includes('/')||v.includes('-')){
    const p=v.split(/[\/\-]/);
    if(p.length===2){
      const n=parseFloat(p[0]),d=parseFloat(p[1]);
      if(!isNaN(n)&&!isNaN(d)&&d!==0) return (n/d)+1;
    }
  }
  return parseFloat(v);
}

function calcular(){
  saveCurrentRace();
  const r=state.races[state.activeRace];
  const err=document.getElementById('errorMsg'); err.innerText='';
  const distanciaHoy=r.distanciaHoy;
  const resultados=[];

  r.caballos.forEach(h=>{
    const tiempo=parseTiempo(h.tiempo);
    const dist=parseFloat(h.dist);
    if(isNaN(tiempo)||isNaN(dist)||dist<=0||!h.num) return;

    const tpProyectado = tiempo * (distanciaHoy / dist);
    const mlDec = parseOdds(h.ml);

    resultados.push({
      num:h.num,
      tpProyectado,
      ml: mlDec
    });
  });

  if(resultados.length===0){
    err.innerText='⚠️ Agrega al menos un caballo con Nº, Tiempo y Distancia válidos.';
    document.getElementById('podiumPanel').style.display='none';
    document.getElementById('resultsPanel').style.display='none';
    return;
  }

  resultados.sort((a,b)=>a.tpProyectado-b.tpProyectado);
  
  renderPodium(resultados.slice(0,3));
  renderResults(resultados);
  
  document.getElementById('podiumPanel').style.display='block';
  document.getElementById('resultsPanel').style.display='block';
  document.getElementById('podiumPanel').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderPodium(top){
  const pod=document.getElementById('podium'); pod.innerHTML='';
  const medals=['🥇','🥈','🥉'];
  const classes=['oro','plata','bronce'];
  const labels=['1º LUGAR','2º LUGAR','3º LUGAR'];
  for(let i=0;i<3;i++){
    const s=document.createElement('div');
    s.className='podium-slot '+classes[i];
    if(top[i]){
      s.innerHTML=`
        <div class="podium-medal">${medals[i]}</div>
        <div class="podium-pos">${labels[i]}</div>
        <div class="podium-num">#${top[i].num}</div>
        <div class="podium-tp">${top[i].tpProyectado.toFixed(2)}s</div>`;
    } else {
      s.innerHTML=`<div class="podium-medal">${medals[i]}</div><div class="podium-pos">${labels[i]}</div><div class="podium-num">—</div>`;
    }
    pod.appendChild(s);
  }
}

function renderResults(resultados){
  const list=document.getElementById('resultsList'); list.innerHTML='';
  resultados.forEach((r,i)=>{
    const row=document.createElement('div');
    row.className='result-row'+(i<3?' pos-'+(i+1):'');
    
    let mlTag = '';
    if(!isNaN(r.ml)){
      if(r.ml >= 4.0) mlTag = '<span class="badge-valor">VALOR</span>';
      else if(r.ml <= 2.5) mlTag = '<span class="badge-trampa">TRAMPA</span>';
    }

    row.innerHTML=`
      <div class="result-rank">${i+1}</div>
      <div class="result-num">#${r.num}</div>
      <div>
        <div><b>Proyectado:</b> ${r.tpProyectado.toFixed(2)}s ${mlTag}</div>
      </div>
      <div class="result-tp">${r.tpProyectado.toFixed(2)}</div>`;
    list.appendChild(row);
  });
}

renderTabs();
renderRace();
</script>
</body>
</html>
