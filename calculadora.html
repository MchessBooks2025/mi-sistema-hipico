<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proyección PRO</title>
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --border: #334155; --gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); padding: 20px; font-size: 14px;
            width: 100vw; overflow-x: hidden; display: flex; justify-content: center;
        }

        .container { width: 100%; max-width: 1100px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* PODIO TOP 3 */
        .podio-panel {
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 15px 20px; margin-bottom: 20px; display: none; gap: 20px; justify-content: space-around;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .podio-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .podio-title { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .pos-1 { color: var(--success); }
        .pos-2 { color: var(--warning); }
        .pos-3 { color: #f97316; }
        .podio-horse { font-size: 16px; font-weight: bold; color: white; }
        .podio-time { font-size: 14px; color: var(--text-muted); }

        /* BARRA DE CONTROLES Y FILTROS */
        .panel-config {
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px;
            margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        .config-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        .config-group label { font-size: 12px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        
        input, select { 
            background-color: #0f172a; border: 1px solid var(--border); color: var(--text-main); 
            padding: 10px; border-radius: 6px; font-size: 15px; outline: none; width: 100%;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .btn-add { 
            background: var(--accent); color: white; border: none; padding: 10px 20px; 
            border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s;
            height: 42px; display: flex; align-items: center; justify-content: center;
        }
        .btn-add:hover { background: var(--accent-hover); }
        
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; height: 42px; transition: 0.2s;}
        .btn-danger:hover { background: var(--danger); color: white; }

        /* TABLA */
        .table-wrapper { 
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; 
            overflow-x: auto; width: 100%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 850px; }
        th { 
            background-color: #1e293b; color: var(--text-muted); font-weight: 600; 
            text-transform: uppercase; font-size: 12px; padding: 15px 10px; 
            text-align: center; border-bottom: 2px solid var(--border);
        }
        td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
        tr:hover td { background-color: rgba(59, 130, 246, 0.05); }

        /* COLORES DEL RANKING */
        .rank-1 td { background-color: rgba(16, 185, 129, 0.15); }
        .rank-2 td { background-color: rgba(245, 158, 11, 0.15); }
        .rank-3 td { background-color: rgba(249, 115, 22, 0.15); }

        .resultado { font-size: 18px; font-weight: bold; color: white; }
        .formula-text { font-size: 11px; color: var(--text-muted); margin-top: 2px; display: block; }
        
        .btn-delete { 
            background: transparent; color: var(--danger); border: none; 
            font-size: 18px; cursor: pointer; transition: 0.2s; 
        }
        .btn-delete:hover { color: #ff6b6b; transform: scale(1.1); }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }

        .btn-back { background: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: 0.2s;}
        .btn-back:hover { background: var(--border); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🧮 Calculadora Proyectada PRO</h1>
            <a href="index.html" class="btn-back">⬅ Volver al Sistema</a>
        </header>

        <!-- BARRA DE CONFIGURACIÓN Y FILTROS -->
        <div class="panel-config">
            <div class="config-group">
                <label>Hipódromo</label>
                <select id="filtroHipodromo" onchange="recalcularTodo()">
                    <optgroup label="Venezuela">
                        <option value="La Rinconada">La Rinconada</option>
                    </optgroup>
                    <optgroup label="Estados Unidos">
                        <option value="Aqueduct">Aqueduct</option>
                        <option value="Belmont Park">Belmont Park</option>
                        <option value="Churchill Downs">Churchill Downs</option>
                        <option value="Del Mar">Del Mar</option>
                        <option value="Fair Grounds">Fair Grounds</option>
                        <option value="Finger Lakes">Finger Lakes</option>
                        <option value="Gulfstream Park">Gulfstream Park</option>
                        <option value="Keeneland">Keeneland</option>
                        <option value="Laurel Park">Laurel Park</option>
                        <option value="Los Alamitos">Los Alamitos</option>
                        <option value="Monmouth Park">Monmouth Park</option>
                        <option value="Mountaineer">Mountaineer</option>
                        <option value="Oaklawn Park">Oaklawn Park</option>
                        <option value="Parx Racing">Parx Racing</option>
                        <option value="Pimlico">Pimlico</option>
                        <option value="Santa Anita Park">Santa Anita Park</option>
                        <option value="Saratoga">Saratoga</option>
                        <option value="Tampa Bay Downs">Tampa Bay Downs</option>
                        <option value="Turfway Park">Turfway Park</option>
                        <option value="Woodbine">Woodbine</option>
                    </optgroup>
                </select>
            </div>
            <div class="config-group">
                <label>Nro de Carrera</label>
                <input type="number" id="filtroCarrera" placeholder="Ej: 1" onchange="recalcularTodo()">
            </div>
            <div class="config-group" style="border-left: 2px solid var(--border); padding-left: 15px;">
                <label style="color: var(--success);">Distancia de HOY (mts)</label>
                <input type="number" id="distancia_hoy" placeholder="Ej: 1400" onchange="recalcularTodo()">
            </div>
            <button onclick="agregarFila()" class="btn-add" style="flex: 0.5;">➕ Añadir Caballo</button>
            <button onclick="limpiarCarrera()" class="btn-danger" title="Borra solo los caballos de esta carrera">🗑️ Limpiar Carrera</button>
        </div>

        <!-- PODIO DINÁMICO -->
        <div class="podio-panel" id="podioPanel">
            <div class="podio-item">
                <div class="podio-title pos-1">🏆 1er Lugar</div>
                <div class="podio-horse" id="podio1">-</div>
                <div class="podio-time" id="podio1_time">-</div>
            </div>
            <div class="podio-item">
                <div class="podio-title pos-2">🥈 2do Lugar</div>
                <div class="podio-horse" id="podio2">-</div>
                <div class="podio-time" id="podio2_time">-</div>
            </div>
            <div class="podio-item">
                <div class="podio-title pos-3">🥉 3er Lugar</div>
                <div class="podio-horse" id="podio3">-</div>
                <div class="podio-time" id="podio3_time">-</div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Nro</th>
                        <th>Ejemplar</th>
                        <th>Último Tiempo (seg)</th>
                        <th>Distancia Carrera Ant.</th>
                        <th style="color: var(--gold);">Tiempo Proyectado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                </tbody>
            </table>
            <div class="empty-state" id="emptyState">
                Selecciona una carrera y agrega un caballo para comenzar.
            </div>
        </div>
    </div>

    <script>
        // Guardamos los datos en localStorage para que no se borren
        let filasCaballos = JSON.parse(localStorage.getItem('calculadoraHipica')) || [];

        function guardar() {
            localStorage.setItem('calculadoraHipica', JSON.stringify(filasCaballos));
        }

        function agregarFila() {
            const hipo = document.getElementById('filtroHipodromo').value;
            const car = document.getElementById('filtroCarrera').value;
            
            if (!car) {
                alert("⚠️ Primero debes escribir el Número de Carrera.");
                return;
            }

            const nuevoCaballo = {
                id: Date.now(),
                hipodromo: hipo,
                carrera: parseInt(car),
                nro: '',
                nombre: '',
                tiempo: '',
                distancia_anterior: ''
            };
            filasCaballos.push(nuevoCaballo);
            guardar();
            recalcularTodo();
        }

        function eliminarFila(id) {
            filasCaballos = filasCaballos.filter(c => c.id !== id);
            guardar();
            recalcularTodo();
        }

        function limpiarCarrera() {
            const hipo = document.getElementById('filtroHipodromo').value;
            const car = document.getElementById('filtroCarrera').value;
            if (!car) return alert("Escribe el número de la carrera que quieres limpiar.");
            
            if(confirm(`¿Borrar todos los caballos de la Carrera ${car} de ${hipo}?`)) {
                filasCaballos = filasCaballos.filter(c => !(c.hipodromo === hipo && c.carrera === parseInt(car)));
                guardar();
                recalcularTodo();
            }
        }

        function actualizarDato(id, campo, valor) {
            const caballo = filasCaballos.find(c => c.id === id);
            if (caballo) {
                caballo[campo] = valor;
                guardar();
                recalcularTodo();
            }
        }

        function recalcularTodo() {
            const distHoy = parseFloat(document.getElementById('distancia_hoy').value);
            const hipoActual = document.getElementById('filtroHipodromo').value;
            const carActual = document.getElementById('filtroCarrera').value;

            // 1. Calcular proyecciones para TODOS los caballos
            filasCaballos.forEach(c => {
                const t = parseFloat(c.tiempo);
                const d_ant = parseFloat(c.distancia_anterior);
                
                c.proyeccion = null;
                c.formula = "";

                if (!isNaN(distHoy) && !isNaN(t) && !isNaN(d_ant) && d_ant > 0) {
                    c.proyeccion = (t * distHoy) / d_ant;
                    c.formula = `(${t} × ${distHoy}) / ${d_ant}`;
                }
            });

            // 2. Filtrar solo los de la carrera actual y ordenar para asignar Ranking
            if (carActual) {
                let caballosCarrera = filasCaballos.filter(c => c.hipodromo === hipoActual && c.carrera === parseInt(carActual) && c.proyeccion !== null);
                caballosCarrera.sort((a,b) => a.proyeccion - b.proyeccion);
                
                // Asignar ranking solo a los de esta carrera
                caballosCarrera.forEach((c, index) => {
                    c.ranking = index + 1;
                });
            }

            // 3. Actualizar la vista
            renderTablaVisual(hipoActual, carActual);
        }

        function renderTablaVisual(hipo, carrera) {
            const tbody = document.getElementById('cuerpoTabla');
            const emptyState = document.getElementById('emptyState');
            const podioPanel = document.getElementById('podioPanel');
            
            tbody.innerHTML = '';

            // Si no hay número de carrera, no mostramos nada
            if (!carrera) {
                emptyState.style.display = 'block';
                podioPanel.style.display = 'none';
                return;
            }

            // Filtrar los caballos de esta carrera específica
            let caballosFiltrados = filasCaballos.filter(c => c.hipodromo === hipo && c.carrera === parseInt(carrera));

            if (caballosFiltrados.length === 0) {
                emptyState.style.display = 'block';
                podioPanel.style.display = 'none';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            // Ordenar para mostrar: primero los que tienen proyección (por ranking), luego los que no
            let validos = caballosFiltrados.filter(c => c.proyeccion !== null).sort((a,b) => a.ranking - b.ranking);
            let invalidos = caballosFiltrados.filter(c => c.proyeccion === null);
            let todos = [...validos, ...invalidos];

            todos.forEach(c => {
                const tr = document.createElement('tr');
                
                // Colores según ranking
                if (c.ranking === 1) tr.classList.add('rank-1');
                if (c.ranking === 2) tr.classList.add('rank-2');
                if (c.ranking === 3) tr.classList.add('rank-3');

                let posMostrar = c.ranking ? c.ranking : '-';
                let proyMostrar = c.proyeccion ? c.proyeccion.toFixed(2) + " seg" : "---";

                tr.innerHTML = `
                    <td style="font-weight: bold; font-size: 18px;">${posMostrar}</td>
                    <td><input type="number" value="${c.nro}" onchange="actualizarDato(${c.id}, 'nro', this.value)" placeholder="Ej: 1" style="text-align:center;"></td>
                    <td><input type="text" value="${c.nombre}" onchange="actualizarDato(${c.id}, 'nombre', this.value)" placeholder="Nombre" style="text-align:left;"></td>
                    <td><input type="number" step="0.01" value="${c.tiempo}" onchange="actualizarDato(${c.id}, 'tiempo', this.value)" placeholder="Ej: 72.5" style="text-align:center;"></td>
                    <td><input type="number" value="${c.distancia_anterior}" onchange="actualizarDato(${c.id}, 'distancia_anterior', this.value)" placeholder="Ej: 1200" style="text-align:center;"></td>
                    <td>
                        <span class="resultado">${proyMostrar}</span>
                        <span class="formula-text">${c.formula}</span>
                    </td>
                    <td><button class="btn-delete" onclick="eliminarFila(${c.id})" title="Eliminar fila">🗑️</button></td>
                `;
                tbody.appendChild(tr);
            });

            // Actualizar Podio (Solo para esta carrera)
            if (validos.length > 0) {
                podioPanel.style.display = 'flex';
                document.getElementById('podio1').innerText = validos[0] ? `#${validos[0].nro} ${validos[0].nombre}` : '-';
                document.getElementById('podio1_time').innerText = validos[0] ? `${validos[0].proyeccion.toFixed(2)} seg` : '';
                
                document.getElementById('podio2').innerText = validos[1] ? `#${validos[1].nro} ${validos[1].nombre}` : '-';
                document.getElementById('podio2_time').innerText = validos[1] ? `${validos[1].proyeccion.toFixed(2)} seg` : '';

                document.getElementById('podio3').innerText = validos[2] ? `#${validos[2].nro} ${validos[2].nombre}` : '-';
                document.getElementById('podio3_time').innerText = validos[2] ? `${validos[2].proyeccion.toFixed(2)} seg` : '';
            } else {
                podioPanel.style.display = 'none';
            }
        }

        // Inicializar
        window.onload = () => {
            recalcularTodo();
        };
    </script>
</body>
</html>
