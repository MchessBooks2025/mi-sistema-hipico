<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Pro USA - Ultra Compacta</title>
<style>
:root{
  --bg:#f1f5f9; --panel:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#cbd5e1; --accent:#2563eb;
  --gold:#FFD700; --silver:#C0C0C0; --bronze:#CD7F32;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); padding:4px; font-size:11px; min-height:100vh;
}
header{margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--border); display:flex; align-items:baseline; justify-content:space-between;}
h1{font-size:15px;font-weight:800;background:linear-gradient(90deg,#2563eb,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.subtitle{font-size:9px;color:var(--text-muted)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:6px;margin-bottom:4px;}
.panel h2{font-size:10px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px; display:inline-block;}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.race-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:6px}
.race-tab{padding:2px 5px;border:1px solid var(--border);background:var(--panel);
  color:var(--text-muted);border-radius:3px;font-weight:700;cursor:pointer;font-size:9px;transition:.15s}
.race-tab:hover{border-color:var(--accent);color:var(--accent)}
.race-tab.active{background:var(--accent);border-color:transparent; color:#fff;}

/* 3 Columnas para Hipódromo/Distancia/Clase */
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.form-group{display:flex;flex-direction:column;}
.form-group input, .form-group select{
  background:#f8fafc;border:1px solid var(--border);color:var(--text);
  padding:3px 5px;border-radius:3px;font-size:11px;outline:none;width:100%;
  font-family:inherit;
}
.form-group input:focus, .form-group select:focus{border-color:var(--accent);background:#fff}

/* Fila de Caballo Ultra Compacta (Horizontal) */
.horses-list{display:flex;flex-direction:column;gap:4px; margin-bottom:6px;}
.horse-card{
  display:grid; 
  grid-template-columns: 35px 1fr 60px 50px 24px; /* Nº, Tiempo, Dist, ML, Boton X */
  gap: 4px; 
  align-items: center;
  background:#f8fafc;
  padding:3px;
  border:1px solid var(--border);
  border-radius:4px;
}
.horse-card input {
  background:#fff;border:1px solid var(--border);color:var(--text);
  padding:3px 4px;border-radius:3px;font-size:11px;outline:none;width:100%; text-align:center;
}
.horse-card input:focus { border-color:var(--accent); }

.btn-remove{
  background:transparent; border:none; color:#ef4444; cursor:pointer; font-weight:900; 
  font-size:14px; display:flex; align-items:center; justify-content:center;
}
.btn-remove:hover{color:#b91c1c}

.btn-add{padding:2px 6px;border:1px dashed var(--accent);background:transparent;
  color:var(--accent);border-radius:3px;font-weight:700;cursor:pointer;font-size:10px;}
.btn-add:hover{background:var(--accent);color:#fff;}

.btn-calcular{background:var(--accent);color:#fff;border:none;
  padding:6px;border-radius:4px;font-size:12px;font-weight:800;cursor:pointer;width:100%;
  margin-top:4px;}

/* Top 3 Súper Compacto */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.podium-slot{border-radius:4px;padding:4px;text-align:center;color:#1a1a1a;font-weight:800;}
.podium-slot.oro{background:linear-gradient(135deg,#FFD700,#FFA500)}
.podium-slot.plata{background:linear-gradient(135deg,#E8E8E8,#A8A8A8)}
.podium-slot.bronce{background:linear-gradient(135deg,#E09E5B,#A0522D)}
.podium-pos{font-size:8px;text-transform:uppercase;opacity:.7}
.podium-num{font-size:14px;font-weight:900;line-height:1;margin:2px 0}
.podium-tp{font-size:10px;font-weight:900}

/* Lista de Resultados Súper Compacta */
.result-row{display:grid;grid-template-columns:20px 35px 1fr auto;gap:4px;align-items:center;
  padding:3px 4px;border-radius:3px;margin-bottom:2px;background:#f8fafc;border:1px solid var(--border); font-size:11px;}
.result-row.pos-1{border-left:3px solid var(--gold);background:#fffbeb}
.result-row.pos-2{border-left:3px solid var(--silver)}
.result-row.pos-3{border-left:3px solid var(--bronze);background:#fdf6ec}
.result-rank{font-weight:900;color:var(--text-muted);text-align:center;}
.result-num{font-weight:800;}
.result-tp{font-weight:900;color:var(--accent);}

.badge-valor{background:rgba(16,185,129,.15);color:#10b981; border:1px solid #10b981;padding:0 3px;border-radius:2px;font-size:8px;font-weight:800;margin-left:4px}
.badge-trampa{background:rgba(239,68,68,.15);color:#ef4444; border:1px solid #ef4444;padding:0 3px;border-radius:2px;font-size:8px;font-weight:800;margin-left:4px}
.error-msg{color:#ef4444;font-size:10px;font-weight:700;text-align:center;margin-top:2px}

/* Ajuste para celulares muy pequeños */
@media(max-width:400px){
  .form-grid{grid-template-columns:1fr 1fr} /* Pasa a 2 columnas */
  .horse-card{grid-template-columns: 30px 1fr 50px 40px 20px;}
}
</style>
</head>
<body>

<header>
  <h1>🏇 Calc Pro USA</h1>
  <div class="subtitle">Top 3</div>
</header>

<div class="panel">
  <div class="race-tabs" id="raceTabs"></div>
  
  <div class="form-grid">
    <div class="form-group">
      <select id="hipodromo" title="Hipódromo">
        <optgroup label="🇺🇸 USA">
          <option value="santa-anita">Santa Anita</option>
          <option value="del-mar">Del Mar</option>
          <option value="churchill">Churchill</option>
          <option value="belmont">Belmont</option>
          <option value="saratoga">Saratoga</option>
          <option value="keeneland">Keeneland</option>
          <option value="gulfstream">Gulfstream</option>
          <option value="aqueduct">Aqueduct</option>
          <option value="pimlico">Pimlico</option>
          <option value="oaklawn">Oaklawn</option>
          <option value="tampa">Tampa Bay</option>
          <option value="monmouth">Monmouth</option>
          <option value="woodbine">Woodbine</option>
        </optgroup>
        <optgroup label="🇻🇪 Venezuela">
          <option value="la-rinconada">La Rinconada</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group">
      <input type="number" id="distanciaHoy" value="1400" title="Distancia Hoy">
    </div>
    <div class="form-group">
      <input type="text" id="loteHoy" value="clm 12500" title="Clase Hoy">
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <h2>🐎 Caballos</h2>
    <button class="btn-add" onclick="addHorse()">+ Añadir</button>
  </div>
  
  <div class="horses-list" id="horsesList"></div>
  <button class="btn-calcular" onclick="calcular()">Calcular Top 3</button>
  <div id="errorMsg" class="error-msg"></div>
</div>

<div class="panel" id="podiumPanel" style="display:none;">
  <h2>🏆 Podio</h2>
  <div class="podium" id="podium"></div>
</div>

<div class="panel" id="resultsPanel" style="display:none;">
  <h2>📊 Ranking</h2>
  <div id="resultsList"></div>
</div>

<script>
const NUM_RACES = 15; 
const state = { activeRace: 1, races: {} };

for (let i = 1; i <= NUM_RACES; i++) {
  state.races[i] = { 
    hipodromo: 'santa-anita', 
    distanciaHoy: 1400, 
    loteHoy: 'clm 12500', 
    caballos: [newHorse()] 
  };
}

function newHorse(){ return {num:'',tiempo:'',dist:'',ml:''}; }

function renderTabs(){
  const tabs=document.getElementById('raceTabs'); tabs.innerHTML='';
  for(let i=1;i<=NUM_RACES;i++){
    const b=document.createElement('button');
    b.className='race-tab'+(i===state.activeRace?' active':'');
    b.textContent=i; // Solo el número para que sea más compacto
    b.title='Carrera '+i;
    b.onclick=()=>switchRace(i);
    tabs.appendChild(b);
  }
}
function switchRace(n){ saveCurrentRace(); state.activeRace=n; renderTabs(); renderRace(); }

function saveCurrentRace(){
  const r=state.races[state.activeRace];
  r.hipodromo=document.getElementById('hipodromo').value;
  r.distanciaHoy=parseFloat(document.getElementById('distanciaHoy').value)||1400;
  r.loteHoy=document.getElementById('loteHoy').value||'';
  
  const cards=document.querySelectorAll('.horse-card');
  r.caballos=[];
  cards.forEach(c=>{
    r.caballos.push({
      num:c.querySelector('.h-num').value,
      tiempo:c.querySelector('.h-tiempo').value,
      dist:c.querySelector('.h-dist').value,
      ml:c.querySelector('.h-ml').value
    });
  });
}

function renderRace(){
  const r=state.races[state.activeRace];
  document.getElementById('hipodromo').value=r.hipodromo;
  document.getElementById('distanciaHoy').value=r.distanciaHoy;
  document.getElementById('loteHoy').value=r.loteHoy;
  
  const list=document.getElementById('horsesList'); list.innerHTML='';
  r.caballos.forEach(h=>addHorseCard(h));
  
  document.getElementById('podiumPanel').style.display='none';
  document.getElementById('resultsPanel').style.display='none';
  document.getElementById('errorMsg').innerText='';
}

function addHorseCard(h){
  const list=document.getElementById('horsesList');
  const card=document.createElement('div');
  card.className='horse-card';
  // Interfaz en línea horizontal
  card.innerHTML=`
    <input class="h-num" type="number" placeholder="Nº" value="${h.num||''}" title="Número">
    <input class="h-tiempo" placeholder="Tiempo (70.4)" value="${h.tiempo||''}" title="Tiempo Última">
    <input class="h-dist" type="number" placeholder="Dist" value="${h.dist||''}" title="Distancia Última">
    <input class="h-ml" placeholder="ML" value="${h.ml||''}" title="Morning Line">
    <button class="btn-remove" onclick="removeHorse(this)" title="Eliminar">✕</button>
  `;
  list.appendChild(card);
}
function addHorse(){ addHorseCard(newHorse()); }
function removeHorse(b){ b.closest('.horse-card').remove(); }

function parseTiempo(v){
  if(!v) return NaN;
  v=v.toString().trim();
  if(v.includes(':')){ const p=v.split(':'); return (parseFloat(p[0])*60)+parseFloat(p[1]); }
  return parseFloat(v);
}
function parseOdds(v){
  if(!v) return NaN;
  v=v.toString().trim();
  if(v.includes('/')||v.includes('-')){
    const p=v.split(/[\/\-]/);
    if(p.length===2){
      const n=parseFloat(p[0]),d=parseFloat(p[1]);
      if(!isNaN(n)&&!isNaN(d)&&d!==0) return (n/d)+1;
    }
  }
  return parseFloat(v);
}

function calcular(){
  saveCurrentRace();
  const r=state.races[state.activeRace];
  const err=document.getElementById('errorMsg'); err.innerText='';
  const distanciaHoy=r.distanciaHoy;
  const resultados=[];

  r.caballos.forEach(h=>{
    const tiempo=parseTiempo(h.tiempo);
    const dist=parseFloat(h.dist);
    if(isNaN(tiempo)||isNaN(dist)||dist<=0||!h.num) return;

    const tpProyectado = tiempo * (distanciaHoy / dist);
    const mlDec = parseOdds(h.ml);

    resultados.push({
      num:h.num,
      tpProyectado,
      ml: mlDec
    });
  });

  if(resultados.length===0){
    err.innerText='⚠️ Faltan datos válidos.';
    document.getElementById('podiumPanel').style.display='none';
    document.getElementById('resultsPanel').style.display='none';
    return;
  }

  resultados.sort((a,b)=>a.tpProyectado-b.tpProyectado);
  
  renderPodium(resultados.slice(0,3));
  renderResults(resultados);
  
  document.getElementById('podiumPanel').style.display='block';
  document.getElementById('resultsPanel').style.display='block';
  document.getElementById('podiumPanel').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderPodium(top){
  const pod=document.getElementById('podium'); pod.innerHTML='';
  const classes=['oro','plata','bronce'];
  const labels=['1º','2º','3º'];
  for(let i=0;i<3;i++){
    const s=document.createElement('div');
    s.className='podium-slot '+classes[i];
    if(top[i]){
      s.innerHTML=`
        <div class="podium-pos">${labels[i]}</div>
        <div class="podium-num">#${top[i].num}</div>
        <div class="podium-tp">${top[i].tpProyectado.toFixed(2)}s</div>`;
    } else {
      s.innerHTML=`<div class="podium-pos">${labels[i]}</div><div class="podium-num">—</div>`;
    }
    pod.appendChild(s);
  }
}

function renderResults(resultados){
  const list=document.getElementById('resultsList'); list.innerHTML='';
  resultados.forEach((r,i)=>{
    const row=document.createElement('div');
    row.className='result-row'+(i<3?' pos-'+(i+1):'');
    
    let mlTag = '';
    if(!isNaN(r.ml)){
      if(r.ml >= 4.0) mlTag = '<span class="badge-valor">VAL</span>';
      else if(r.ml <= 2.5) mlTag = '<span class="badge-trampa">TRAMP</span>';
    }

    row.innerHTML=`
      <div class="result-rank">${i+1}</div>
      <div class="result-num">#${r.num}</div>
      <div><b>${r.tpProyectado.toFixed(2)}s</b> ${mlTag}</div>
      <div class="result-tp">${r.tpProyectado.toFixed(2)}</div>`;
    list.appendChild(row);
  });
}

renderTabs();
renderRace();
</script>
</body>
</html>
